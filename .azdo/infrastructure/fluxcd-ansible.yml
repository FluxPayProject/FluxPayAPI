trigger: none
pr: none

resources:
  pipelines:
    - pipeline: infrastructure
      source: '\Infrastructure\Terraform Create'
      trigger:
        branches:
          include:
            - refs/heads/develop
  repositories:
    - repository: fluxBootstrap
      type: github
      name: FluxPayProject/fluxcd-operator-install-ansible
      endpoint: FluxCD_Ansible_GitHub
      ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

variables:
  - group: FluxCD_Ansible_Vault
  - name: aksResourceGroup
    value: rg-aks-d01
  - name: aksClusterName
    value: my-aks-cluster-d01

steps:
  - checkout: self
    path: s/fluxpay

  - checkout: fluxBootstrap
    path: s/flux-bootstrap

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.13'

  - bash: |
      set -euo pipefail
      python -m pip install --require-hashes --only-binary :all: -r requirements.lock
      ansible-galaxy collection install -r requirements.galaxy.yml -p .ansible/collections
    displayName: Install Ansible dependencies
    workingDirectory: $(Pipeline.Workspace)/s/flux-bootstrap

  - task: AzureCLI@2
    displayName: Provision FluxCD on AKS
    inputs:
      azureSubscription: Azure_Connection
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(Pipeline.Workspace)/s/flux-bootstrap
      inlineScript: |
        exec python3 "$(Pipeline.Workspace)/s/fluxpay/.azdo/infrastructure/provision_fluxcd.py"
    env:
      INGRESS_ARTIFACT: $(Build.ArtifactStagingDirectory)/traefik.auto.tfvars.json
      AKS_RESOURCE_GROUP: $(aksResourceGroup)
      AKS_CLUSTER_NAME: $(aksClusterName)
      ANSIBLE_VAULT_PASSWORD: $(ANSIBLE_VAULT_PASSWORD)

  - publish: $(Build.ArtifactStagingDirectory)/traefik.auto.tfvars.json
    artifact: traefik-ingress
    displayName: Publish Traefik IP

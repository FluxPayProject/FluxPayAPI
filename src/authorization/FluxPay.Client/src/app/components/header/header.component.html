<a routerLink="/transactions" class="logo">
  <svg-icon src="../../../assets/svg/logo.svg" class="logoSvg" />
  <p class="logoName">FluxPay</p>
</a>
<div class="profile">
  @if (profileName$ | async; as name) {
    <span class="fullName" [title]="name">{{ name }}</span>
    <app-avatar class="avatar" [name]="name" />
  } @else {
    <span class="skeleton skeletonDefault" aria-hidden="true"></span>
    <span class="skeleton avatar" aria-hidden="true"></span>
  }
</div>

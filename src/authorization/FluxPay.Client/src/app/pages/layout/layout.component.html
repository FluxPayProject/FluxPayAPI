<div class="layout">
    <app-notifications></app-notifications>
    <ng-container *ngIf="_profileStateService.wasAuthenticationCheck">
        <app-login-window *ngIf="!_profileStateService.isAuthenticated"></app-login-window>
        <div class="layoutContainer" [attr.inert]="_profileStateService.isAuthenticated ? null : ''"
             (touchstart)="startNavigationSwipe($event)" (touchend)="endNavigationSwipe($event)"
             (touchcancel)="cancelNavigationSwipe()">
            <app-header [attr.inert]="navigationOpen() ? '' : null">
                <button #navigationToggle type="button" class="navigationToggle" aria-label="Open menu"
                        aria-controls="app-navigation" [attr.aria-expanded]="navigationOpen()" (click)="openNavigation()">
                    <span aria-hidden="true"></span>
                </button>
            </app-header>
            @if (navigationOpen()) {
                <div class="navigationBackdrop" aria-hidden="true" (click)="closeNavigation()"></div>
            }
            <div id="app-navigation" class="navigationDrawer" [class.navigationOpen]="navigationOpen()"
                 [attr.role]="navigationOpen() ? 'dialog' : null" [attr.aria-modal]="navigationOpen() ? 'true' : null"
                 [attr.aria-label]="navigationOpen() ? 'Menu' : null" [cdkTrapFocus]="navigationOpen()"
                 (keydown.escape)="onNavigationEscape($event)">
                <div class="navigationDrawerHeader">
                    <span>Menu</span>
                    <button #navigationClose type="button" class="navigationClose" aria-label="Close menu"
                            (click)="closeNavigation()">×</button>
                </div>
                <app-navbar (click)="onNavigationClick($event)"></app-navbar>
            </div>
            <app-main [attr.inert]="navigationOpen() ? '' : null"></app-main>
        </div>
    </ng-container>
    <ng-container *ngIf="!_profileStateService.wasAuthenticationCheck">
        @if (authenticationUnavailable()) {
            <div class="authenticationError">
                <p role="alert">Could not check your session. Check your connection and try again.</p>
                <button type="button" (click)="checkAuthentication()">Try again</button>
            </div>
        } @else {
            <span class="loader"></span>
        }
    </ng-container>
</div>
